services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      load-balancer:
        condition: service_started
    networks:
      - todo-network

  load-balancer:
    build:
      context: ./load-balancer
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      api-3:
        condition: service_healthy
    networks:
      - todo-network

  api-1:
    build:
      context: ./backend
    environment:
      INSTANCE_NAME: api-1
    networks:
      - todo-network
    healthcheck: &api-healthcheck
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api-2:
    build:
      context: ./backend
    environment:
      INSTANCE_NAME: api-2
    networks:
      - todo-network
    healthcheck: *api-healthcheck

  api-3:
    build:
      context: ./backend
    environment:
      INSTANCE_NAME: api-3
    networks:
      - todo-network
    healthcheck: *api-healthcheck

networks:
  todo-network:
    driver: bridge
