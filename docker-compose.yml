services:
  mysql:
    image: monalisaess/projeto-01-cloud-todo1-mysql:1.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_todo}
      MYSQL_DATABASE: todo_list
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_local_todo}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      load-balancer:
        condition: service_started
    networks:
      - todo-network

  load-balancer:
    build:
      context: ./load-balancer
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      api-3:
        condition: service_healthy
    networks:
      - todo-network

  api-1:
    build:
      context: ./backend
    environment:
      INSTANCE_NAME: api-1
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: todo_list
      DB_USER: todo_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-todo_local_todo}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - todo-network
    healthcheck: &api-healthcheck
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api-2:
    build:
      context: ./backend
    environment:
      INSTANCE_NAME: api-2
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: todo_list
      DB_USER: todo_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-todo_local_todo}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - todo-network
    healthcheck: *api-healthcheck

  api-3:
    build:
      context: ./backend
    environment:
      INSTANCE_NAME: api-3
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: todo_list
      DB_USER: todo_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-todo_local_todo}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - todo-network
    healthcheck: *api-healthcheck

volumes:
  mysql-data:

networks:
  todo-network:
    driver: bridge
